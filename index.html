<!doctype html>
<html lang="en" class="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1318" />
    <meta
      name="description"
      content="Praamix makes original games and develops games for clients with Unity and Unreal Engine, across mobile, PC, web, console and XR."
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Praamix · Original games and game development</title>
    <!--
      Everything in this style block and the #boot element below is here so a
      visitor on a slow connection sees something at once: the right background
      colour, then the loader, before any of the site's code has arrived.
    -->
    <style>
      html {
        background: #ffffff;
        color: #191c20;
      }

      html.night {
        background: #0f1318;
        color: #f3f5f7;
      }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.1rem;
        padding: 1.5rem;
        background: inherit;
        background-color: #ffffff;
        font:
          600 1rem/1.4 system-ui,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        text-align: center;
        /* Stays invisible for the first third of a second, so a fast load never flashes it. */
        animation: boot-in 0.3s ease 0.35s both;
        transition: opacity 0.4s ease;
      }

      html.night #boot {
        background-color: #0f1318;
      }

      #boot[data-done] {
        opacity: 0;
        pointer-events: none;
      }

      /* The Sheriff Town VR logo. Its revolver drum is a second picture laid over it, so it can spin. */
      .boot__logo {
        position: relative;
        width: min(16rem, 62vw);
        aspect-ratio: 4 / 3;
        margin-bottom: -1rem;
      }

      .boot__logo img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .boot__logo .boot__drum {
        top: 44.333%;
        left: 24.833%;
        width: 22.833%;
        height: auto;
        aspect-ratio: 1;
        border-radius: 50%;
        animation: boot-spin 1.5s linear infinite;
      }

      /* The Praamix logo, small: the name with its two A's as game pieces, which hop in turn while the site loads. */
      .boot__name {
        display: flex;
        align-items: baseline;
        margin: 0;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: 0.01em;
        line-height: 1;
      }

      .boot__name svg {
        width: auto;
        height: 0.76em;
        margin: 0 0.03em;
        fill: currentColor;
        overflow: visible;
        animation: boot-hop 1.2s cubic-bezier(0.3, 0, 0.3, 1) infinite;
      }

      .boot__name svg + svg {
        fill: #f26b38;
        animation-delay: 0.6s;
      }

      .boot__bar {
        width: 9rem;
        height: 3px;
        overflow: hidden;
        border-radius: 99rem;
        background: rgb(128 136 148 / 0.3);
      }

      .boot__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #f26b38;
        animation: boot-slide 1.3s ease-in-out infinite;
      }

      .boot__text {
        max-width: 22rem;
        margin: 0;
        font-size: 0.9rem;
        opacity: 0.75;
      }

      .boot__retry {
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #f26b38;
        color: #191c20;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      #boot [hidden] {
        display: none;
      }

      @keyframes boot-in {
        from {
          opacity: 0;
        }
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-hop {
        0%,
        40%,
        100% {
          transform: translateY(0);
        }

        20% {
          transform: translateY(-0.3em);
        }
      }

      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }

        100% {
          transform: translateX(260%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot__drum,
        .boot__name svg,
        .boot__bar span {
          animation: none;
        }

        .boot__bar span {
          width: 100%;
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status">
      <div class="boot__logo" aria-hidden="true">
        <img src="/media/stv-logo-480.webp" width="480" height="360" alt="" />
        <img class="boot__drum" src="/media/stv-drum-160.webp" width="160" height="160" alt="" />
      </div>
      <p class="boot__name" aria-label="Praamix">
        <span aria-hidden="true">PR</span>
        <svg viewBox="0 0 26 30" aria-hidden="true"><circle cx="13" cy="6.6" r="6.6" /><path d="M0.6 30 8.94 11.8h8.12L25.4 30z" /></svg>
        <svg viewBox="0 0 26 30" aria-hidden="true"><circle cx="13" cy="6.6" r="6.6" /><path d="M0.6 30 8.94 11.8h8.12L25.4 30z" /></svg>
        <span aria-hidden="true">MIX</span>
      </p>
      <div class="boot__bar" aria-hidden="true"><span></span></div>
      <p class="boot__text" id="boot-text">Loading…</p>
      <button class="boot__retry" id="boot-retry" type="button" hidden>Try again</button>
    </div>
    <div id="root"></div>
    <noscript>
      <p style="margin: 2rem; font: 1.125rem/1.5 system-ui, sans-serif">
        Praamix makes original games and develops games for clients. This site needs JavaScript to
        display.
      </p>
    </noscript>
    <script>
      /*
       * Runs before the site's code arrives. It tells a waiting visitor what
       * is going on: after a few seconds, that the connection looks slow; and
       * if the site's code cannot be fetched at all, that it failed, with a
       * button to try again. The site itself calls window.__bootDone() once
       * the first page is on screen, and the loader fades away.
       */
      ;(function () {
        var boot = document.getElementById('boot')
        var text = document.getElementById('boot-text')
        var retry = document.getElementById('boot-retry')
        var finished = false

        var slow = setTimeout(function () {
          if (!finished) text.textContent = 'Still loading. Your connection looks slow, but it is on its way.'
        }, 6000)

        /*
         * While a new version of the site is being published, a visitor can
         * briefly get the new page but not yet its code, and the browser may
         * then keep that "not found" answer. So when a file fails, the loader
         * fetches every failed file again straight from the server, which
         * replaces the browser's saved answer, and reloads once, quietly.
         * Only a second failure within a minute, or no connection at all, is
         * shown as an error. The Try again button does the same repair.
         */
        var failedFiles = []

        function retriedRecently() {
          try {
            return Date.now() - Number(sessionStorage.getItem('boot-retried') || 0) < 60000
          } catch (error) {
            return true
          }
        }

        function repairAndReload() {
          try {
            sessionStorage.setItem('boot-retried', String(Date.now()))
          } catch (error) {}
          var refetch = window.fetch
            ? Promise.all(
                failedFiles.map(function (file) {
                  return fetch(file, { cache: 'reload' }).catch(function () {})
                }),
              )
            : Promise.resolve()
          refetch.then(function () {
            location.reload()
          })
        }

        function fail() {
          if (finished) return
          if (navigator.onLine && !retriedRecently()) {
            finished = true
            clearTimeout(slow)
            /* A moment's wait gathers every file that failed with this one. */
            setTimeout(repairAndReload, 300)
            return
          }
          clearTimeout(slow)
          text.textContent = 'The site could not load. Check your connection and try again.'
          retry.hidden = false
        }

        retry.addEventListener('click', repairAndReload)

        /* A script or stylesheet that fails to arrive reports an error on itself. */
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return
            var file = target.src || target.href
            if (file && failedFiles.indexOf(file) < 0) failedFiles.push(file)
            fail()
          },
          true,
        )

        window.__bootDone = function () {
          if (finished) return
          finished = true
          /* It loaded, so a later failure may retry once again. */
          try {
            sessionStorage.removeItem('boot-retried')
          } catch (error) {}
          clearTimeout(slow)
          boot.setAttribute('data-done', '')
          setTimeout(function () {
            boot.remove()
          }, 450)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
