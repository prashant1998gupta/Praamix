<!doctype html>
<meta charset="utf-8">
<!-- Day 09: GetComponent in Update. Search every frame vs a cached reference. -->
<style>
  @font-face { font-family: Manrope; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; background: #070a0f; } canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="frame.js"></script>
<script>
const COMPS = ['Transform', 'MeshRenderer', 'Collider', 'Animator', 'AudioSource', 'Rigidbody']
const FRAME = 0.9

function scene(t, box, tools, cached) {
  const { cx, C, F, rr } = tools
  const x0 = 470, y0 = box.top + 212, h = 36
  // the GameObject's component list
  cx.fillStyle = C.soft; cx.font = F(700, 14); cx.textAlign = 'left'; cx.fillText('PLAYER GAMEOBJECT', x0, y0 - 8)
  const frame = t < 1.4 ? -1 : Math.floor((t - 1.4) / FRAME)
  const k = t < 1.4 ? 0 : ((t - 1.4) % FRAME) / FRAME
  const scan = cached ? -1 : Math.min(COMPS.length - 1, Math.floor(k * 1.6 * COMPS.length))
  COMPS.forEach((c, i) => {
    const y = y0 + i * (h + 4), target = i === COMPS.length - 1
    rr(x0, y, 300, h, 8)
    cx.fillStyle = i === scan ? 'rgba(255,77,94,.35)' : target ? 'rgba(76,195,255,.18)' : 'rgba(255,255,255,.05)'; cx.fill()
    cx.fillStyle = target ? C.blue : C.soft; cx.font = F(700, 17); cx.fillText(c, x0 + 14, y + 24)
  })
  // the script asking for it
  const sx = 110, sy = box.top + 330
  rr(sx - 30, sy - 34, 230, 68, 14); cx.fillStyle = '#18202b'; cx.fill(); cx.strokeStyle = 'rgba(255,255,255,.2)'; cx.lineWidth = 2; cx.stroke()
  cx.fillStyle = C.text; cx.font = F(800, 16); cx.fillText('PlayerMove.cs', sx - 14, sy - 6)
  cx.fillStyle = C.soft; cx.font = F(600, 14); cx.fillText(cached ? 'rb.AddForce(...)' : 'GetComponent<Rigidbody>()', sx - 14, sy + 16)
  const ty = y0 + (COMPS.length - 1) * (h + 4) + h / 2
  if (cached) {
    cx.strokeStyle = C.green; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(sx + 200, sy); cx.lineTo(x0, ty); cx.stroke()
    cx.fillStyle = C.green; cx.font = F(700, 14); cx.fillText('saved once in Awake()', sx - 14, sy + 56)
    if (k < 0.2 && frame >= 0) { cx.beginPath(); cx.arc(x0 + 300 - 20, ty, 8, 0, 7); cx.fillStyle = C.green; cx.fill() }
  } else if (scan >= 0) {
    const yy = y0 + scan * (h + 4) + h / 2
    cx.strokeStyle = C.red; cx.lineWidth = 3; cx.setLineDash([6, 6]); cx.beginPath(); cx.moveTo(sx + 200, sy); cx.lineTo(x0, yy); cx.stroke(); cx.setLineDash([])
    if (scan === COMPS.length - 1) { cx.fillStyle = C.red; cx.font = F(800, 15); cx.fillText('found… again', x0 + 310, ty + 5) }
  }
  // counter
  const lookups = cached ? (t < 1.4 ? 0 : 1) : Math.max(0, frame + 1)
  cx.fillStyle = C.soft; cx.font = F(700, 14); cx.fillText('LOOKUPS SO FAR', 80, box.top + 418)
  cx.fillStyle = cached ? C.green : C.red; cx.font = F(800, 34); cx.fillText(String(lookups), 80, box.top + 455)
  cx.fillStyle = C.soft; cx.font = F(600, 15); cx.fillText(cached ? 'once, at start' : 'one per frame, forever', 140, box.top + 452)
  cx.textAlign = 'left'
}

series({
  day: 9, pillar: 'Performance', duration: 30, takeawayAt: 21.6,
  title: ['GetComponent', 'in Update'],
  subtitle: 'Same script, same Rigidbody. Count the searches.',
  note: 'Simplified picture of the lookup cost, slowed down',
  lanes: [
    { title: 'Look it up every frame', sub: 'Search the GameObject for the component, again and again.', accent: '#ff4d5e',
      readout: ['EVERY FRAME', 'Search again'], draw(t, box, tools) { scene(t, box, tools, false) } },
    { title: 'Cache the reference', sub: 'Find it once in Awake(), keep it in a field.', accent: '#2fe39a',
      readout: ['EVERY FRAME', 'Use the saved reference'], draw(t, box, tools) { scene(t, box, tools, true) } },
  ],
  rows: [['Cache', 'Look it up once, in Awake().'], ['Reuse', 'Keep the reference in a field.'], ['TryGetComponent', 'Use it when the component might be missing.']],
  question: ['GetComponent in Update:', 'still a problem in 2026? 👇'],
})
</script>
