<!doctype html>
<meta charset="utf-8">
<!-- Day 28: testing a feature takes two minutes. Play from the menu vs a debug scene with cheats. -->
<style>
  @font-face { font-family: Manrope; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; background: #070a0f; } canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="frame.js"></script>
<script>
const BEGIN = 1.8
const SLOW = [['Main menu', 1.3], ['Loading', 2.2], ['Level 1', 1.0], ['Walk to the boss', 3.0], ['Get the item', 1.6], ['Test!', 0.9]]
const SLOW_TOTAL = SLOW.reduce((a, [, d]) => a + d, 0)
const FAST = [['Debug scene', 0.5], ['Teleport', 0.3], ['Give item', 0.3], ['Test!', 0.9]]
const FAST_TOTAL = FAST.reduce((a, [, d]) => a + d, 0)
const PX = 46 // pixels per second on the timeline

function run(cx, rr, C, F, t, b, steps, total, col) {
  const T = b.top, live = Math.max(0, t - BEGIN)
  const tries = Math.floor(live / total), local = live % total
  // current step
  let acc = 0, cur = steps[0][0]
  for (const [name, d] of steps) { if (local < acc + d) { cur = name; break } acc += d }
  rr(80, T + 215, 920, 110, 18); cx.fillStyle = '#121925'; cx.fill()
  cx.fillStyle = C.soft; cx.font = F(700, 16); cx.textAlign = 'left'; cx.fillText('ON SCREEN', 104, T + 246)
  cx.fillStyle = cur === 'Test!' ? col : C.text; cx.font = F(800, 38); cx.fillText(t < BEGIN ? '' : cur, 104, T + 296)
  // timeline of every attempt so far
  const y = T + 360
  cx.fillStyle = C.soft; cx.font = F(700, 15); cx.fillText('TIME SPENT', 80, y - 8)
  let x = 80
  for (let i = 0; i <= tries; i++) {
    const upto = i < tries ? total : local
    let a = 0
    for (const [name, d] of steps) {
      const w = Math.min(d, Math.max(0, upto - a)) * PX
      if (w > 0 && x < 1000) {
        cx.fillStyle = name === 'Test!' ? col : 'rgba(255,255,255,.18)'
        cx.fillRect(x, y, Math.min(w, 1000 - x) - 1, 30)
      }
      x += d * PX * (i < tries ? 1 : 0)
      a += d
    }
    if (i === tries) x += upto * PX
    x += 6
  }
  return tries + (local > total - 0.9 ? 1 : 0)
}

series({
  day: 28, pillar: 'Workflow', duration: 30, takeawayAt: 21.6,
  title: ['Testing one feature', 'takes 2 minutes'],
  subtitle: 'Same feature to test. Count how often you actually test it.',
  note: 'Timings illustrative, sped up',
  lanes: [
    {
      title: 'Play from the main menu', sub: 'Every test starts from the very beginning.', accent: '#ff4d5e',
      readout: ['TIMES YOU TESTED IT', ''],
      draw(t, b, { cx, rr, C, F }) {
        const n = run(cx, rr, C, F, t, b, SLOW, SLOW_TOTAL, C.red)
        cx.fillStyle = C.red; cx.font = F(800, 26); cx.textAlign = 'left'; cx.fillText(String(t < BEGIN ? 0 : n), 98, b.top + 183)
        cx.fillStyle = C.soft; cx.font = F(600, 18); cx.fillText('grey = getting there, red = actually testing', 80, b.top + 425)
      },
    },
    {
      title: 'Debug scene + cheats', sub: 'Start next to the feature. Teleport, spawn, skip.', accent: '#2fe39a',
      readout: ['TIMES YOU TESTED IT', ''],
      draw(t, b, { cx, rr, C, F }) {
        const n = run(cx, rr, C, F, t, b, FAST, FAST_TOTAL, C.green)
        cx.fillStyle = C.green; cx.font = F(800, 26); cx.textAlign = 'left'; cx.fillText(String(t < BEGIN ? 0 : n), 98, b.top + 183)
        cx.fillStyle = C.soft; cx.font = F(600, 18); cx.fillText('grey = getting there, green = actually testing', 80, b.top + 425)
      },
    },
  ],
  rows: [['Debug scene', 'A small scene that starts right at the feature.'], ['Cheats', 'Teleport, give items, spawn enemies in one click.'], ['Gate them', 'Keep debug tools out of release builds.']],
  question: ['Ship debug tools in builds,', 'or strip them all? 👇'],
})
</script>
