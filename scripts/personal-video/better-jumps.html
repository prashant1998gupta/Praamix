<!doctype html>
<meta charset="utf-8">
<!-- Day 13: floaty jumps. Plain gravity and no grace period vs faster fall + coyote time. -->
<style>
  @font-face { font-family: Manrope; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; background: #070a0f; } canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="frame.js"></script>
<script>
const CYCLE = 4.2
const RUN = 220            // px per second
const EDGE = 470, FAR = 590
const PRESS_LATE = 0.16    // the player presses jump this long after the edge
const COYOTE = 0.25        // grace period after leaving the ledge
const START_X = 130
const edgeTime = (EDGE - START_X) / RUN
const pressTime = edgeTime + PRESS_LATE

function sim(local, good) {
  // returns { x, h } where h is height above the platform (negative = falling)
  const x = START_X + RUN * local
  if (local < edgeTime) return { x, h: 0, state: 'run' }
  const jumped = good && PRESS_LATE <= COYOTE
  if (!jumped) {
    const tf = local - edgeTime
    return { x, h: -0.5 * 2200 * tf * tf, state: local >= pressTime ? 'ignored' : 'air' }
  }
  if (local < pressTime) { const tf = local - edgeTime; return { x, h: -0.5 * 2200 * tf * tf, state: 'coyote' } }
  const h0 = -0.5 * 2200 * PRESS_LATE * PRESS_LATE
  const v0 = 560, gUp = 1700, gDown = 3400
  const tj = local - pressTime, tPeak = v0 / gUp
  let h
  if (tj < tPeak) h = h0 + v0 * tj - 0.5 * gUp * tj * tj
  else { const hp = h0 + v0 * tPeak - 0.5 * gUp * tPeak * tPeak, td = tj - tPeak; h = hp - 0.5 * gDown * td * td }
  const xNow = x
  if (xNow >= FAR && h <= 0) return { x: xNow, h: 0, state: 'landed' }
  return { x: xNow, h, state: 'jump' }
}

function scene(t, box, tools, good) {
  const { cx, C, F } = tools
  const accent = good ? C.green : C.red
  const g = box.top + 390
  const local = t % CYCLE
  // platforms and gap
  cx.fillStyle = '#1d2633'; cx.fillRect(80, g, EDGE - 80, 60); cx.fillRect(FAR, g, 990 - FAR, 60)
  cx.fillStyle = 'rgba(255,255,255,.25)'; cx.fillRect(80, g, EDGE - 80, 4); cx.fillRect(FAR, g, 990 - FAR, 4)
  if (good) {
    const cw = RUN * COYOTE
    cx.fillStyle = 'rgba(47,227,154,.14)'; cx.fillRect(EDGE, g - 200, cw, 200)
    cx.fillStyle = C.green; cx.font = F(700, 15); cx.textAlign = 'center'; cx.fillText('coyote time', EDGE + cw / 2, g - 208)
  }
  // dotted trail of the whole move
  cx.fillStyle = good ? 'rgba(47,227,154,.35)' : 'rgba(255,77,94,.35)'
  for (let s = 0; s < local; s += 0.06) {
    const p = sim(s, good); const py = g - p.h
    if (py > box.top + 470) break
    cx.beginPath(); cx.arc(p.x, py - 6, 3, 0, 7); cx.fill()
  }
  const p = sim(local, good)
  let y = g - p.h
  let x = p.x
  if (p.state === 'landed') { x = Math.min(p.x, 930) }
  if (y < box.top + 560) figure(cx, Math.min(x, 940), y, accent, t, 1, p.state === 'run' || p.state === 'landed', 0.75)
  // the jump press
  const sincePress = local - pressTime
  if (sincePress >= 0 && sincePress < 0.9) {
    cx.globalAlpha = 1 - sincePress / 0.9
    tools.rr(EDGE - 300, box.top + 214, 150, 46, 12); cx.fillStyle = C.text; cx.fill()
    cx.fillStyle = '#0b0e12'; cx.font = F(800, 20); cx.textAlign = 'center'; cx.fillText('JUMP pressed', EDGE - 225, box.top + 244)
    cx.globalAlpha = 1
  }
  cx.font = F(800, 28); cx.textAlign = 'center'
  if (!good && local > pressTime + 0.1) { cx.fillStyle = C.red; cx.fillText('Too late. Fell.', 760, box.top + 240) }
  if (good && p.state === 'landed') { cx.fillStyle = C.green; cx.fillText('Made it ✓', 820, box.top + 240) }
  cx.fillStyle = 'rgba(244,246,248,.45)'; cx.font = F(700, 14); cx.fillText('pressed just after the edge', EDGE - 225, box.top + 282)
  cx.textAlign = 'left'
}

series({
  day: 13, pillar: 'Physics', duration: 30, takeawayAt: 21.6,
  title: ['Why your jumps', 'feel floaty'],
  subtitle: 'The player presses jump a moment after the ledge. Same press, both lanes.',
  note: 'Timings illustrative',
  lanes: [
    {
      title: 'Strict ground check', sub: 'Off the ledge means no jump. Plain gravity.', accent: '#ff4d5e',
      readout: ['THE PLAYER FEELS', '"I pressed it!"'],
      draw(t, box, tools) { scene(t, box, tools, false) },
    },
    {
      title: 'Coyote time + fast fall', sub: 'A short grace period, and heavier gravity on the way down.', accent: '#2fe39a',
      readout: ['THE PLAYER FEELS', 'Responsive and snappy'],
      draw(t, box, tools) { scene(t, box, tools, true) },
    },
  ],
  rows: [['Coyote time', 'Allow a jump for a moment after leaving a ledge.'], ['Fall faster', 'Raise gravity on the way down for a snappier arc.'], ['Cut it short', 'Release jump early for a shorter hop.']],
  question: ['Is coyote time a cheat,', 'or just good design? 👇'],
})
</script>
