<!doctype html>
<meta charset="utf-8">
<!-- Day 07: Update() is not free. Many MonoBehaviour Updates vs one manager loop. -->
<style>
  @font-face { font-family: Manrope; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; background: #070a0f; } canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="frame.js"></script>
<script>
const COLS = 16, ROWS = 4, N = COLS * ROWS, SWEEP = 2.2

function scene(t, box, tools, managed) {
  const { cx, C, F, rr } = tools
  const ex = 120, ey = box.top + 320
  // engine box
  rr(ex - 50, ey - 40, 100, 80, 14); cx.fillStyle = '#18202b'; cx.fill(); cx.strokeStyle = 'rgba(255,255,255,.2)'; cx.lineWidth = 2; cx.stroke()
  cx.fillStyle = C.soft; cx.font = F(800, 15); cx.textAlign = 'center'; cx.fillText('ENGINE', ex, ey + 5)

  const gx = 420, gy = box.top + 245, step = 36
  const k = t < 1.4 ? -1 : ((t - 1.4) % SWEEP) / SWEEP
  const cur = Math.floor(k * N)
  let mx = 0
  if (managed) {
    mx = 300
    rr(mx - 55, ey - 34, 110, 68, 14); cx.fillStyle = 'rgba(47,227,154,.15)'; cx.fill(); cx.strokeStyle = C.green; cx.lineWidth = 2; cx.stroke()
    cx.fillStyle = C.green; cx.font = F(800, 14); cx.fillText('MANAGER', mx, ey - 4); cx.font = F(700, 12); cx.fillText('for each: Tick()', mx, ey + 14)
    cx.strokeStyle = 'rgba(47,227,154,.8)'; cx.lineWidth = 4; cx.beginPath(); cx.moveTo(ex + 50, ey); cx.lineTo(mx - 55, ey); cx.stroke()
    cx.fillStyle = C.green; cx.font = F(700, 12); cx.fillText('1 call', (ex + mx) / 2 + 5, ey - 10)
  }
  for (let i = 0; i < N; i++) {
    const x = gx + (i % COLS) * step, y = gy + Math.floor(i / COLS) * step
    const active = i === cur, done = i < cur
    if (active) {
      cx.strokeStyle = managed ? 'rgba(47,227,154,.6)' : 'rgba(255,77,94,.85)'; cx.lineWidth = 2
      cx.beginPath(); cx.moveTo(managed ? mx + 55 : ex + 50, ey); cx.lineTo(x, y); cx.stroke()
    }
    cx.beginPath(); cx.arc(x, y, 10, 0, 7)
    cx.fillStyle = active ? C.text : done ? (managed ? C.green : C.red) : 'rgba(255,255,255,.14)'; cx.fill()
  }
  // frame cost bar: overhead (grey) + work (colour) per object
  const bx = 90, by = box.top + 418, total = 900
  cx.fillStyle = C.soft; cx.font = F(700, 13); cx.textAlign = 'left'; cx.fillText(managed ? 'COST THIS FRAME: one call, then plain C# loop' : 'COST THIS FRAME: grey = call overhead per object', bx, by - 10)
  const per = managed ? 8 : 14, over = managed ? 0 : 6
  const shown = cur < 0 ? 0 : cur + 1
  let x = bx + (managed ? 10 : 0)
  if (managed && shown) { cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(bx, by, 8, 22) }
  for (let i = 0; i < shown && x < bx + total; i++) {
    if (over) { cx.fillStyle = 'rgba(255,255,255,.35)'; cx.fillRect(x, by, over, 22); x += over }
    cx.fillStyle = managed ? C.green : C.red; cx.fillRect(x, by, per - over - 1, 22); x += per - over
  }
  cx.textAlign = 'left'
}

series({
  day: 7, pillar: 'Performance', duration: 30, takeawayAt: 21.6,
  title: ['Update() is', 'not free'],
  subtitle: 'Same objects, same work. Count the calls.',
  note: 'Illustrative; it matters at thousands of objects',
  lanes: [
    { title: 'An Update() on every object', sub: 'The engine calls into each script, one by one.', accent: '#ff4d5e',
      readout: ['PER FRAME', 'One call per object'], draw(t, box, tools) { scene(t, box, tools, false) } },
    { title: 'One manager loop', sub: 'One Update() calls Tick() on a plain list.', accent: '#2fe39a',
      readout: ['PER FRAME', 'One call, one loop'], draw(t, box, tools) { scene(t, box, tools, true) } },
  ],
  rows: [['Measure', 'Profile first: it matters at thousands.'], ['Centralise', 'One manager calls Tick() on a list.'], ['Skip idle', 'Only tick the objects that need it.']],
  question: ['Manager pattern: clean,', 'or overkill? 👇'],
})
</script>
