<!doctype html>
<meta charset="utf-8">
<!-- Day 24: saving game data. PlayerPrefs calls everywhere vs one versioned save model. -->
<style>
  @font-face { font-family: Manrope; src: url('../../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2') format('woff2'); font-weight: 200 800; }
  html, body { margin: 0; background: #070a0f; } canvas { display: block; }
</style>
<canvas id="c" width="1080" height="1350"></canvas>
<script src="frame.js"></script>
<script>
const SCRIPTS = [
  ['Player.cs', 110, 250, 'SetInt("coins")'],
  ['Shop.cs', 330, 300, 'SetString("items")'],
  ['Quest.cs', 120, 390, 'SetInt("quest_3")'],
  ['Audio.cs', 330, 420, 'SetFloat("vol")'],
  ['Inventory.cs', 560, 250, 'SetInt("slot_2")'],
]
function box(cx, rr, x, y, w, h, fill, stroke) { rr(x, y, w, h, 12); cx.fillStyle = fill; cx.fill(); if (stroke) { cx.strokeStyle = stroke; cx.lineWidth = 2; cx.stroke() } }
function disk(cx, F, C, x, y, label, col) {
  cx.fillStyle = '#18202b'; cx.beginPath(); cx.ellipse(x, y - 30, 70, 16, 0, 0, 7); cx.fill()
  cx.fillRect(x - 70, y - 30, 140, 70); cx.beginPath(); cx.ellipse(x, y + 40, 70, 16, 0, 0, 7); cx.fill()
  cx.strokeStyle = col; cx.lineWidth = 2; cx.beginPath(); cx.ellipse(x, y - 30, 70, 16, 0, 0, 7); cx.stroke()
  cx.fillStyle = C.soft; cx.font = F(700, 16); cx.textAlign = 'center'; cx.fillText(label, x, y + 12)
}
function pulse(cx, x1, y1, x2, y2, k, col) {
  const x = x1 + (x2 - x1) * k, y = y1 + (y2 - y1) * k
  cx.beginPath(); cx.arc(x, y, 7, 0, 7); cx.fillStyle = col; cx.shadowColor = col; cx.shadowBlur = 14; cx.fill(); cx.shadowBlur = 0
}

series({
  day: 24, pillar: 'Architecture', duration: 30, takeawayAt: 21.6,
  title: ['Saving game data', 'without the mess'],
  subtitle: 'Same game, same data. Two ways to save it.',
  note: 'Simplified to show the idea',
  lanes: [
    {
      title: 'PlayerPrefs everywhere', sub: 'Every script saves its own keys, its own way.', accent: '#ff4d5e',
      readout: ['SAVE LOGIC LIVES IN', '5 scripts, 5 formats'],
      draw(t, b, { cx, rr, C, F }) {
        const T = b.top, dx = 880, dy = T + 330
        disk(cx, F, C, dx, dy, 'Registry', C.red)
        SCRIPTS.forEach(([name, x, y, call], i) => {
          const sy = T + y - 40
          cx.strokeStyle = 'rgba(255,77,94,.25)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(x + 150, sy + 22); cx.lineTo(dx - 70, dy); cx.stroke()
          box(cx, rr, x, sy, 190, 44, '#18202b', 'rgba(255,255,255,.12)')
          cx.fillStyle = C.text; cx.font = F(800, 18); cx.textAlign = 'left'; cx.fillText(name, x + 14, sy + 29)
          const ph = (t * 0.7 + i * 0.37) % 1.6
          if (ph < 1 && t > 2) {
            pulse(cx, x + 150, sy + 22, dx - 70, dy, ph, C.red)
            cx.fillStyle = 'rgba(255,77,94,.9)'; cx.font = F(700, 13); cx.fillText(call, x + 14, sy - 8)
          }
        })
        // the two classic failures
        const fails = [[7, 'Quest.cs forgot to save ✕'], [13, 'Renamed a key: old saves lost ✕'], [17.5, 'No version: can’t migrate ✕']]
        for (const [at, msg] of fails) {
          const d = t - at
          if (d > 0 && d < 3.6) { cx.globalAlpha = Math.min(1, d * 3, (3.6 - d) * 3); cx.fillStyle = C.red; cx.font = F(800, 22); cx.textAlign = 'center'; cx.fillText(msg, 600, T + 460 - 8); cx.globalAlpha = 1 }
        }
      },
    },
    {
      title: 'One save model', sub: 'Scripts fill one SaveData. One place writes it to disk.', accent: '#2fe39a',
      readout: ['SAVE LOGIC LIVES IN', 'One class, one file'],
      draw(t, b, { cx, rr, C, F }) {
        const T = b.top, mx = 520, my = T + 330, dx = 880
        disk(cx, F, C, dx, my, 'save.json', C.green)
        const names = ['Player.cs', 'Shop.cs', 'Quest.cs', 'Audio.cs', 'Inventory.cs']
        names.forEach((n, i) => {
          const y = T + 222 + i * 48
          box(cx, rr, 80, y, 170, 38, '#18202b', 'rgba(255,255,255,.12)')
          cx.fillStyle = C.text; cx.font = F(800, 17); cx.textAlign = 'left'; cx.fillText(n, 94, y + 25)
          cx.strokeStyle = 'rgba(47,227,154,.25)'; cx.lineWidth = 2; cx.beginPath(); cx.moveTo(250, y + 19); cx.lineTo(mx - 110, my); cx.stroke()
          const ph = (t * 0.6 + i * 0.2) % 2
          if (ph < 1 && t > 2) pulse(cx, 250, y + 19, mx - 110, my, ph, C.green)
        })
        box(cx, rr, mx - 110, my - 80, 220, 160, '#13261f', C.green)
        cx.fillStyle = C.green; cx.font = F(800, 24); cx.textAlign = 'center'; cx.fillText('SaveData', mx, my - 42)
        cx.fillStyle = C.soft; cx.font = F(600, 16)
        ;['coins, items', 'quests, settings', 'inventory'].forEach((s, i) => cx.fillText(s, mx, my - 12 + i * 22))
        const ver = t > 14 ? 'v2' : 'v1'
        box(cx, rr, mx + 62, my - 98, 60, 32, C.green); cx.fillStyle = '#0b0e12'; cx.font = F(800, 18); cx.fillText(ver, mx + 92, my - 76)
        cx.strokeStyle = 'rgba(47,227,154,.5)'; cx.lineWidth = 3; cx.beginPath(); cx.moveTo(mx + 110, my); cx.lineTo(dx - 70, my); cx.stroke()
        const sv = (t * 0.5) % 2; if (sv < 1 && t > 3) pulse(cx, mx + 110, my, dx - 70, my, sv, C.green)
        const d = t - 14
        if (d > 0 && d < 5) { cx.globalAlpha = Math.min(1, d * 3, (5 - d) * 3); cx.fillStyle = C.green; cx.font = F(800, 22); cx.textAlign = 'center'; cx.fillText('Old v1 save loaded and upgraded to v2 ✓', 560, T + 452); cx.globalAlpha = 1 }
      },
    },
  ],
  rows: [['One model', 'Every saved value lives in one SaveData class.'], ['One writer', 'A single save system serialises it to disk.'], ['Version it', 'Store a version so old saves can be upgraded.']],
  question: ['JSON or binary saves?', 'Which do you ship? 👇'],
})
</script>
